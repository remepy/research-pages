<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Quiz App</title>
    <style>
        /* General styles */
        body {
            font-family: 'Inter', sans-serif;
            direction: rtl;
            background-color: #f3f4f6; /* bg-gray-100 */
            min-height: 100vh; /* min-h-screen */
            display: flex; /* flex */
            align-items: center; /* items-center */
            padding: 0; /* Removed padding */
            width: 95%; /* Use 95% of screen width */
            margin: auto; /* Center the body */
        }
        
        /* App container */
        .app-container {
            background-color: #fff; /* bg-white */
            padding: 0.5rem; /* Reduced padding */
            border-radius: 1rem; /* rounded-2xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-xl */
            max-width: none; /* Removed max-w-lg */
            width: 100%; /* w-full */
            height: 90vh;
            display: flex; /* flex */
            flex-direction: column; /* flex-col */
            margin-left: auto; /* mx-auto */
            margin-right: auto; /* mx-auto */
        }

        /* Responsive padding for app container */
        @media (min-width: 640px) {
            .app-container {
                padding: 1rem; /* Adjusted sm:p-8 */
            }
        }

        /* Typography */
        /* Custom font sizes for larger text */
        .text-custom-title { /* For welcome page title */
            font-size: 2.5rem;
            padding: 0.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        .welcome-text-paragraph { /* For welcome page body text paragraphs */
            font-size: 1.5rem;
            line-height: 1.2; /* Further reduced line height for tighter spacing */
            margin-top: 0.2rem; /* Reduced margin */
            margin-bottom: 0.2rem; /* Reduced margin */
        }
        .text-custom-body { /* For question text on other pages */
            font-size: 1.5rem; 
            line-height: 1.3;
        }
        .text-custom-button { /* For options and next/back buttons */
            font-size: 2rem; /* Increased */
        }
        .text-custom-next-button { /* For main next button */
            font-size: 2rem;
        }
        .text-custom-back-button { /* For back button */
            font-size: 1.5rem; 
        }


        .text-gray-800 { color: #1f2937; } /* text-gray-800 */
        .text-gray-600 { color: #4b5563; } /* text-gray-600 */
        .text-gray-500 { color: #6b7280; } /* text-gray-500 */
        .text-purple-700 { color: #7e22ce; } /* text-purple-700 */
        .text-purple-800 { color: #6b21a8; } /* text-purple-800 */
        .text-white { color: #fff; } /* text-white */
        .font-bold { font-weight: 700; } /* font-bold */
        .font-semibold { font-weight: 600; } /* font-semibold */
        .leading-relaxed { line-height: 1.625; } /* leading-relaxed */
        .text-center { text-align: center; } /* text-center */
        .text-right { text-align: right; } /* text-right */
        
        /* Flex and spacing */
        .flex { display: flex; } /* flex */
        .flex-col { flex-direction: column; } /* flex-col */
        .flex-grow { flex-grow: 1; } /* flex-grow */
        .items-center { align-items: center; } /* items-center */
        .justify-center { justify-content: center; } /* justify-center */
        .justify-between { justify-content: space-between; } /* justify-between */
        .justify-start { justify-content: flex-start; } /* justify-start */
        .space-y-4 > * + * { margin-top: 1rem; } /* space-y-4 */
        .space-x-2 > * + * { margin-left: 0.5rem; } /* space-x-2 */
        .w-full { width: 100%; } /* w-full */
        .max-w-xs { max-width: 20rem; } /* max-w-xs */
        
        /* Buttons and interactive elements */
        .option-button {
            width: 100%;
            padding: 1rem 1rem; /* py-4 px-6 */
            text-align: right; /* text-right */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-md */
            transition-property: all; /* transition-all */
            transition-duration: 150ms;
            background-color: #fff; /* bg-white */
            border: 2px solid #e5e7eb; /* border-2 border-gray-200 */
            color: #1f2937; /* text-gray-800 */
            font-size: 1.2rem; /* text-custom-button */
            /* No hover effect */
        }
        .option-button.active {
            background-color: #e9d5ff; /* bg-purple-200 */
            border-color: #9333ea; /* border-purple-600 */
            color: #6b21a8; /* text-purple-800 */
            font-weight: 700; /* font-bold */
        }
        .next-button {
            width: 100%;
            color: #fff; /* text-white */
            font-weight: 700; /* font-bold */
            padding: 1rem 1.5rem; /* py-4 px-6 */
            border-radius: 1rem; /* rounded-2xl */
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; /* transition-colors */
            transition-duration: 150ms;
            background-color: #9333ea; /* bg-purple-600 */
            font-size: 2rem; /* text-custom-next-button */
        }
        .next-button:hover {
            background-color: #7e22ce; /* hover:bg-purple-700 */
        }
        .next-button:disabled {
            background-color: #9ca3af; /* bg-gray-400 */
            cursor: not-allowed;
        }

        .back-button {
            display: flex;
            align-items: center;
            color: #6b7280; /* text-gray-500 */
            font-size: 1.5rem; /* text-custom-back-button */
        }
        .back-button:hover {
            color: #374151; /* hover:text-gray-700 */
        }
        
        /* Utility classes */
        .p-6 { padding: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .mb-4 { margin-bottom: 1rem; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05); }

        /* Accordion specific styles */
        .accordion-header {
            background-color: #eff6ff; /* Very light blue, almost white */
            border: 2px solid #dbeafe; /* Lighter blue border */
            font-weight: 700; /* Bold to make it stand out */
            display: flex; /* To align text and icon */
            justify-content: space-between; /* To push text to right, icon to left */
            align-items: center;
            cursor: pointer; /* Indicate it's clickable */
            padding: 1rem 1.5rem; /* Same padding as option-button for consistency */
            border-radius: 0.75rem; /* Same border-radius */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            color: #1e40af; /* Tailwind text-blue-800 */
            font-size: 1.5rem; /* text-custom-button equivalent */
            /* No hover effect */
        }

        /* Navy blue for active accordion header */
        .accordion-header.active {
            background-color: #000080; /* Navy blue background */
            border-color: #000080; /* Navy blue border */
            color: #fff; /* White text */
            font-weight: 700; /* font-bold */
        }

        /* Accordion icon styling */
        .accordion-icon {
            transition: transform 0.3s ease-in-out; /* Smooth rotation */
            transform: rotate(0deg); /* Points down initially (closed) */
            height: 2rem; /* Adjusted size to match text height */
            width: 2rem; /* Adjusted size to match text height */
        }

        .accordion-header.active .accordion-icon {
            transform: rotate(180deg); /* Points up when active/open */
        }

        /* Accordion content */
        .accordion-content {
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 0.5rem; /* Reduced space between accordion options (x2 from 1rem) */
            padding-top: 0.5rem; /* Space after main option (reduced) */
            padding-bottom: 0.5rem; /* Added padding to bottom of accordion content (reduced) */
        }
        .accordion-content.is-open {
            display: flex;
        }

        /* The sub-options within the accordion should still look like regular option buttons */
        .accordion-content .option-button {
            background-color: #f9fafb; /* Lighter background for sub-options */
            border-color: #e5e7eb; /* Keep light border */
            font-size: 1.5rem; /* Match other option buttons or slightly smaller */
            padding: 0.8rem 1.2rem; /* Slightly smaller padding than main options */
            /* No hover effect */
        }
        .accordion-content .option-button.active {
            background-color: #d8b4fe; /* bg-purple-300 for active sub-option */
            border-color: #7e22ce; /* border-purple-700 */
            color: #4c1d95; /* text-purple-900 */
        }

        /* Icon styling */
        .h-5 { height: 1.25rem; }
        .w-5 { width: 1.25rem; }

        /* Reduced space between question lines */
        .question-text-group {
            line-height: 1.1; /* Tighter line spacing for question text */
        }

        /* Reduced space between general options */
        .options-container-reduced-space .option-button {
            margin-bottom: 0.5rem; /* Half of original 1rem space */
        }
        .options-container-reduced-space .option-button:last-child {
            margin-bottom: 0;
        }

        /* Unified spacing for main options container */
        #main-options-container {
            gap: 0.5rem; /* Match the gap of accordion-content and options-container-reduced-space */
        }
    </style>
    <script src="app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center p-4">

    <!-- Main application container. The mx-auto class will center the container. -->
    <div id="app" class="app-container">
        <!-- Content will be dynamically inserted here by JavaScript -->
    </div>

    <script>
        // Heroicons SVG for chevrons
        const getChevronRightIcon = () => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
                <path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.5 4.5a.75.75 0 0 1 0 1.06l-4.5 4.5a.75.75 0 0 1-1.06-1.06L12.94 10 8.22 5.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
            </svg>
        `;

        const getChevronLeftIcon = () => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
                <path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L7.06 10l4.72 4.72a.75.75 0 1 1-1.06 1.06l-5.25-5.25a.75.75 0 0 1 0-1.06l5.25-5.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
            </svg>
        `;
        
        // Chevron for accordion (points down)
        const getChevronDownIcon = () => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="accordion-icon">
                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0L5.23 8.27a.75.75 0 010-1.06z" clip-rule="evenodd" />
            </svg>
        `;


        // Question data objects for each page
        const pages = {
            welcome: {
                id: 'welcome',
                title: 'ברוכים הבאים',
                text: 'מיד נשאל ארבע שאלות על השפעת התרופות. \nלאחר מכן תתבקשו לבצע כמה מטלות פשוטות. הפעילות כולה אמורה לארוך כ-5 דקות, נשמח אם תחזרו עליה החודש כמה שיותר פעמים - פעם במצב Off ופעם במצב On.',
                buttonText: 'מעבר לשאלות',
            },
            onOffQuestion: {
                id: 'onOffQuestion',
                text: 'באיזו מידה את/ה חש/ה כרגע במצב OFF?',
                options: [
                    { text: 'כלל לא', value: '1' },
                    { text: 'במידה מועטה', value: '2' },
                    { text: 'במידה מסוימת', value: '3' },
                    { text: 'במידה רבה', value: '4' },
                    { text: 'לחלוטין', value: '5' },
                ],
            },
            levodopaQuestion: {
                id: 'levodopaQuestion',
                text: 'כמה זמן בערך עבר מאז לקחת Levodopa בפעם האחרונה?',
                mainOptions: [
                    { text: 'פחות משעה', value: 'lessThanHour' },
                    { text: 'שעה או יותר', value: 'moreThanHour' },
                ],
                subOptions: {
                    'lessThanHour': [
                        { text: 'פחות מ-15 דקות', value: '0' },
                        { text: 'בין 15 דקות ל-30 דקות', value: '15' },
                        { text: 'בין 30 דקות ל-45 דקות', value: '30' },
                        { text: 'בין 45 דקות לשעה', value: '45' },
                    ],
                    'moreThanHour': [
                        { text: 'בין שעה לשעתיים', value: '60' },
                        { text: 'בין שעתיים לשלוש שעות', value: '120' },
                        { text: 'בין שלוש לארבע שעות', value: '180' },
                        { text: 'ארבע שעות או יותר', value: '240' },
                    ],
                },
                requiresSubSelection: true,
            },
            eatingQuestion: {
                id: 'eatingQuestion',
                text: 'כמה זמן עבר מאז אכלת בפעם האחרונה?',
                mainOptions: [
                    { text: 'פחות משעה', value: 'lessThanHour' },
                    { text: 'שעה או יותר', value: 'moreThanHour' },
                ],
                subOptions: {
                    'lessThanHour': [
                        { text: 'פחות מ-15 דקות', value: '0' },
                        { text: 'בין 15 דקות ל-30 דקות', value: '15' },
                        { text: 'בין 30 דקות ל-45 דקות', value: '30' },
                        { text: 'בין 45 דקות לשעה', value: '45' },
                    ],
                    'moreThanHour': [
                        { text: 'בין שעה לשעתיים', value: '60' },
                        { text: 'בין שעתיים לשלוש שעות', value: '120' },
                        { text: 'בין שלוש לארבע שעות', value: '180' },
                        { text: 'ארבע שעות או יותר', value: '240' },
                    ],
                },
                requiresSubSelection: true,
            },
            gettingUpQuestion: {
                id: 'gettingUpQuestion',
                text: 'האם היית מתקשה אם היית צריכ/ה לקום עכשיו מהכיסא?',
                options: [
                    { text: 'לא', value: 'False' },
                    { text: 'כן', value: 'True' },
                ],
            },
            debug: {
                id: 'debug',
                title: 'תשובות',
                buttonText: 'התחל מחדש',
            }
        };

        let currentPage = 'welcome';
        let userAnswers = {};
        const appContainer = document.getElementById('app');
        let currentOpenAccordion = null; // To track the currently open accordion section

        // Function to render the current page
        const renderPage = (pageId) => {
            appContainer.innerHTML = ''; // Clear previous content
            currentPage = pageId;

            let contentHTML = '';
            let backButtonHTML = '';
            let nextButtonHTML = '';
            const pageData = pages[currentPage];

            // Render Back button if not on the welcome page
            if (currentPage !== 'welcome') {
                backButtonHTML = `
                    <div class="flex justify-start items-center px-4 py-2 text-purple-700 font-bold text-xl">
                        <button id="back-button" class="back-button text-custom-back-button">
                            ${getChevronRightIcon()}
                            <span>חזרה</span>
                        </button>
                    </div>
                `;
            }

            // Function to render multiline text as separate paragraphs
            const renderMultiLineText = (text, className = 'welcome-text-paragraph') => {
                const lines = text.split('\n');
                return lines.map(line => `<p class="${className}">${line}</p>`).join('');
            };

            // Render the main content for the current page
            switch (currentPage) {
                case 'welcome':
                    contentHTML = `
                        <div class="p-4 flex flex-col items-center text-right">
                            <h1 class="text-custom-title font-bold text-gray-800 mb-2">${pageData.title}</h1>
                            ${renderMultiLineText(pageData.text, 'welcome-text-paragraph text-gray-600')}
                        </div>
                    `;
                    nextButtonHTML = `
                        <div class="p-6">
                            <button id="next-button" class="next-button text-custom-next-button">
                                ${pageData.buttonText}
                            </button>
                        </div>
                    `;
                    break;
                case 'onOffQuestion':
                case 'gettingUpQuestion':
                    contentHTML = `
                        <div class="p-4 flex flex-col space-y-2 h-full text-right"> <!-- Reduced space-y -->
                            <div class="flex flex-col question-text-group"> <!-- Apply tighter line spacing here -->
                                ${pageData.text.split('\n').map(line => `
                                    <p class="text-custom-body text-gray-800 font-semibold my-0">${line}</p>
                                `).join('')}
                            </div>
                            <div class="flex flex-col options-container-reduced-space flex-grow w-full" id="options-container">
                                ${pageData.options.map(option => `
                                    <button
                                        data-value="${option.value}"
                                        class="option-button text-custom-button"
                                    >
                                        ${option.text}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    if (!pageData.oneClick) {
                        nextButtonHTML = `
                            <div class="p-6">
                                <button id="next-button" disabled class="next-button text-custom-next-button">
                                    הבא
                                </button>
                            </div>
                        `;
                    }

                    setTimeout(() => {
                        const prevSelectedValue = userAnswers[currentPage];
                        const nextBtnOnPage = document.getElementById('next-button');
                        if (prevSelectedValue) {
                            const selectedButton = document.querySelector(`.option-button[data-value="${prevSelectedValue}"]`);
                            if (selectedButton) {
                                selectedButton.classList.add('active');
                            }
                            // Re-enable next button if a selection was found
                            if (nextBtnOnPage) {
                                nextBtnOnPage.disabled = false;
                            }
                        }
                    }, 0);

                    
                    break;
                case 'levodopaQuestion':
                case 'eatingQuestion':
                    contentHTML = `
                        <div class="p-4 flex flex-col space-y-2 h-full text-right"> <!-- Reduced space-y -->
                            <p class="text-custom-body text-gray-800 font-semibold my-0">${pageData.text}</p>
                            <div class="flex flex-col space-y-2 w-full" id="main-options-container"> <!-- Reduced space-y -->
                                ${pageData.mainOptions.map(option => `
                                    <button
                                        data-value="${option.value}"
                                        data-type="accordion-header"
                                        class="accordion-header text-custom-button"
                                    >
                                        <span>${option.text}</span>
                                        ${getChevronDownIcon()}
                                    </button>
                                    <div id="sub-options-container-${option.value}" class="accordion-content">
                                        ${pageData.subOptions[option.value].map(subOption => `
                                            <button
                                                data-value="${subOption.value}"
                                                data-type="sub"
                                                class="option-button text-custom-button"
                                            >
                                                ${subOption.text}
                                            </button>
                                        `).join('')}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    nextButtonHTML = `
                        <div class="p-6">
                            <button id="next-button" disabled class="next-button text-custom-next-button">
                                הבא
                            </button>
                        </div>
                    `;
                    
                    // Logic to immediately open previous selection if returning to page
                    setTimeout(() => {
                        const nextBtn = document.getElementById('next-button');
                        const mainSelectionValue = userAnswers[currentPage + '_main'];
                        const subSelectionValue = userAnswers[currentPage];

                        if (mainSelectionValue) {
                            const mainButton = document.querySelector(`button[data-value="${mainSelectionValue}"][data-type="accordion-header"]`);
                            const subOptionsContainerToOpen = document.getElementById(`sub-options-container-${mainSelectionValue}`);
                            
                            if (mainButton) {
                                mainButton.classList.add('active');
                            }
                            if (subOptionsContainerToOpen) {
                                subOptionsContainerToOpen.classList.add('is-open');
                                currentOpenAccordion = subOptionsContainerToOpen; // Track the open accordion
                            }

                            if (subSelectionValue) {
                                const subButton = subOptionsContainerToOpen.querySelector(`button[data-value="${subSelectionValue}"][data-type="sub"]`);
                                if (subButton) {
                                    subButton.classList.add('active');
                                }
                                if (nextBtn) nextBtn.disabled = false;
                            }
                        }
                    }, 0); 
                    break;
                case 'debug':
                    // The debug-toggle button and the summary container have been removed as requested.
                    contentHTML = `
                        <div class="flex-grow p-6 flex flex-col items-center justify-end">
                            <h1 class="text-3xl font-bold mb-12 text-center">תודה!</h1>
                            <br />
                            <br />
                            <br />
                            <br />
                            <br />
                            <button id="next-activity-button" class="next-button w-full max-w-xs flex items-center justify-center space-x-2 space-x-reverse shadow-lg text-custom-next-button mb-4">
                                <span>לפעילות הבאה</span>
                                ${getChevronLeftIcon()}
                            </button>
                        </div>
                    `;
                    
                    // No next button for the debug page, as requested.
                    nextButtonHTML = ``;
                    
                    break;
            }

            appContainer.innerHTML = `
                <div class="flex flex-col h-full">
                    ${backButtonHTML}
                    <div class="flex-grow flex flex-col justify-between">
                        ${contentHTML}
                    </div>
                    ${nextButtonHTML}
                </div>
            `;
            
            addEventListeners();
        };

        const handleNext = () => {            
            switch (currentPage) {
                case 'welcome':
                    renderPage('onOffQuestion');
                    break;
                case 'onOffQuestion':
                    renderPage('levodopaQuestion');
                    break;
                case 'levodopaQuestion':
                    renderPage('eatingQuestion');
                    break;
                case 'eatingQuestion':
                    renderPage('gettingUpQuestion');
                    break;
                case 'gettingUpQuestion':
                    renderPage('debug');
                    break;
                case 'debug':
                    // This function generates the summary. 
                    const generateSummary = () => {
                        console.log(userAnswers);
                        const summary = {};

                        summary.gameName = 'questionnaire';
                        
                        // Likert Scale Question
                        if (userAnswers.onOffQuestion) {
                            summary.onOffFeeling = parseInt(userAnswers.onOffQuestion);
                        }

                        // Levodopa Time Questions
                        if (userAnswers.levodopaQuestion_main === 'lessThanHour') {
                            if (userAnswers.levodopaQuestion) {
                                summary.timeSinceLevodopaMinutes = parseInt(userAnswers.levodopaQuestion);
                            }
                        } else if (userAnswers.levodopaQuestion_main === 'moreThanHour') {
                            if (userAnswers.levodopaQuestion) {
                                summary.timeSinceLevodopaMinutes = parseInt(userAnswers.levodopaQuestion);
                            }
                        }

                        // Eating Time Questions
                        if (userAnswers.eatingQuestion_main === 'lessThanHour') {
                            if (userAnswers.eatingQuestion) {
                                summary.timeSinceEatingMinutes = parseInt(userAnswers.eatingQuestion);
                            }
                        } else if (userAnswers.eatingQuestion_main === 'moreThanHour') {
                            if (userAnswers.eatingQuestion) {
                                summary.timeSinceEatingMinutes = parseInt(userAnswers.eatingQuestion);
                            }
                        }

                        // Final Boolean Question (now called gettingUpQuestion)
                        if (userAnswers.gettingUpQuestion) {
                            summary.gettingUpDifficulty = userAnswers.gettingUpQuestion === 'True' ? true : false;
                        }

                        return summary;
                    };

                    const summary = generateSummary();
                    notifyClientToSendPayload(summary);
                    // Finished with quiz
                    notifyClientToNext();
                    break;
                default:
                    renderPage('welcome');
            }
        };

        const handleBack = () => {
            switch (currentPage) {
                case 'onOffQuestion':
                    renderPage('welcome');
                    break;
                case 'levodopaQuestion':
                    renderPage('onOffQuestion');
                    break;
                case 'eatingQuestion':
                    userAnswers.levodopaQuestion_main = userAnswers.levodopaQuestion_main; // Keep main selection for accordions
                    renderPage('levodopaQuestion');
                    break;
                case 'gettingUpQuestion':
                    userAnswers.eatingQuestion_main = userAnswers.eatingQuestion_main; // Keep main selection for accordions
                    renderPage('eatingQuestion');
                    break;
                case 'debug':
                    renderPage('gettingUpQuestion');
                    break;
                default:
                    renderPage('welcome');
            }
        };

        const addEventListeners = () => {
            const nextButton = document.getElementById('next-button');
            if (nextButton) {
                nextButton.addEventListener('click', handleNext);
            }

            const backButton = document.getElementById('back-button');
            if (backButton) {
                backButton.addEventListener('click', handleBack);
            }
            
            const nextActivityButton = document.getElementById('next-activity-button');
            if (nextActivityButton) {
                nextActivityButton.addEventListener('click', handleNext);
            }

            // --- Accordion Logic ---
            const mainOptionsContainers = document.querySelectorAll('button[data-type="accordion-header"]');
            const subOptionsContainers = document.querySelectorAll('.accordion-content');
            const nextBtn = document.getElementById('next-button');

            mainOptionsContainers.forEach(mainButton => {
                mainButton.addEventListener('click', (event) => {
                    const mainValue = event.currentTarget.dataset.value;
                    const targetSubContainer = document.getElementById(`sub-options-container-${mainValue}`);

                    // If a different accordion is open, close it
                    if (currentOpenAccordion && currentOpenAccordion !== targetSubContainer) {
                        currentOpenAccordion.classList.remove('is-open');
                        const prevMainButton = document.querySelector(`button[data-value="${currentOpenAccordion.id.replace('sub-options-container-', '')}"][data-type="accordion-header"]`);
                        if (prevMainButton) {
                            prevMainButton.classList.remove('active');
                        }
                    }

                    // Toggle the clicked accordion
                    targetSubContainer.classList.toggle('is-open');
                    event.currentTarget.classList.toggle('active');

                    // Set currentOpenAccordion to the newly opened one, or null if just closed
                    currentOpenAccordion = targetSubContainer.classList.contains('is-open') ? targetSubContainer : null;

                    // Reset selected sub-option for this accordion section and disable next button
                    if (!userAnswers[currentPage]) {
                        if (nextBtn) nextBtn.disabled = true;
                    }

                    // Store main selection (for back button navigation)
                    userAnswers[currentPage + '_main'] = mainValue;

                    // Ensure all other sub-options are not active for the current page type
                    document.querySelectorAll('button[data-type="sub"]').forEach(btn => {
                        btn.classList.remove('active');
                    });
                });
            });

            // Event delegation for sub-options
            subOptionsContainers.forEach(subContainer => {
                subContainer.addEventListener('click', (event) => {
                    if (event.target.tagName === 'BUTTON' && event.target.dataset.type === 'sub') {
                        const subValue = event.target.dataset.value;
                        userAnswers[currentPage] = subValue;

                        // Update sub button styles
                        subContainer.querySelectorAll('button[data-type="sub"]').forEach(btn => {
                            btn.classList.remove('active');
                        });
                        event.target.classList.add('active');

                        // Enable next button
                        if (nextBtn) {
                            nextBtn.disabled = false;
                        }
                    }
                });
            });

            // --- End Accordion Logic ---


            // For non-accordion question pages (original logic)
            const optionsContainer = document.getElementById('options-container');
            // This condition ensures this block only runs for non-accordion pages
            if (optionsContainer && !pages[currentPage].requiresSubSelection) { 
                optionsContainer.querySelectorAll('.option-button').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const value = event.target.dataset.value;
                        
                        userAnswers[currentPage] = value;

                        optionsContainer.querySelectorAll('.option-button').forEach(btn => {
                            btn.classList.remove('active');
                        });
                        event.target.classList.add('active');

                        if (nextButton) {
                            nextButton.disabled = false;
                        }

                        const pageData = pages[currentPage];
                        if (pageData.oneClick) {
                             setTimeout(() => handleNext(), 100);
                        }
                    });
                });
            }
        };

        window.onload = () => {
            renderPage('welcome');
        };

    </script>
</body>
</html>
