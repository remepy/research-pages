<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Quiz App</title>
    <style>
        /* General styles */
        body {
            font-family: 'Inter', sans-serif;
            direction: rtl;
            background-color: #f3f4f6; /* bg-gray-100 */
            min-height: 100vh; /* min-h-screen */
            display: flex; /* flex */
            align-items: center; /* items-center */
            padding: 0; /* Removed padding */
            width: 95%; /* Use 95% of screen width */
            margin: auto; /* Center the body */
        }
        
        /* App container */
        .app-container {
            background-color: #fff; /* bg-white */
            padding: 0.5rem; /* Reduced padding */
            border-radius: 1rem; /* rounded-2xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-xl */
            max-width: none; /* Removed max-w-lg */
            width: 100%; /* w-full */
            height: 90vh;
            display: flex; /* flex */
            flex-direction: column; /* flex-col */
            margin-left: auto; /* mx-auto */
            margin-right: auto; /* mx-auto */
        }

        /* Responsive padding for app container */
        @media (min-width: 640px) {
            .app-container {
                padding: 1rem; /* Adjusted sm:p-8 */
            }
        }

        /* Typography */
        /* Custom font sizes for larger text */
        .text-custom-title { /* For welcome page title */
            font-size: 4rem;
            padding: 0.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        .text-custom-body { /* For welcome page body text and question text */
            font-size: 1.5rem;
            line-height: 1.2; /* Further reduced line height for tighter spacing */
            margin-top: 0.5rem; /* Reduced margin */
            margin-bottom: 0.5rem; /* Reduced margin */
        }
        .text-custom-button { /* For option buttons */
            font-size: 1.5rem; /* 1.8rem * 0.8 */
        }
        .text-custom-next-button { /* For main next button */
            font-size: 2rem; /* 2.2rem * 0.8 */
        }
        .text-custom-back-button { /* For back button */
            font-size: 1.5rem; /* 1.8rem * 0.8 */
        }


        .text-gray-800 { color: #1f2937; } /* text-gray-800 */
        .text-gray-600 { color: #4b5563; } /* text-gray-600 */
        .text-gray-500 { color: #6b7280; } /* text-gray-500 */
        .text-purple-700 { color: #7e22ce; } /* text-purple-700 */
        .text-purple-800 { color: #6b21a8; } /* text-purple-800 */
        .text-white { color: #fff; } /* text-white */
        .font-bold { font-weight: 700; } /* font-bold */
        .font-semibold { font-weight: 600; } /* font-semibold */
        .leading-relaxed { line-height: 1.625; } /* leading-relaxed */
        .text-center { text-align: center; } /* text-center */
        .text-right { text-align: right; } /* text-right */
        
        /* Flex and spacing */
        .flex { display: flex; } /* flex */
        .flex-col { flex-direction: column; } /* flex-col */
        .flex-grow { flex-grow: 1; } /* flex-grow */
        .items-center { align-items: center; } /* items-center */
        .justify-center { justify-content: center; } /* justify-center */
        .justify-between { justify-content: space-between; } /* justify-between */
        .justify-start { justify-content: flex-start; } /* justify-start */
        .space-y-4 > * + * { margin-top: 1rem; } /* space-y-4 */
        .space-x-2 > * + * { margin-left: 0.5rem; } /* space-x-2 */
        .w-full { width: 100%; } /* w-full */
        .max-w-xs { max-width: 20rem; } /* max-w-xs */
        
        /* Buttons and interactive elements */
        .option-button {
            width: 100%;
            padding: 1rem 1rem; /* py-4 px-6 */
            text-align: right; /* text-right */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-md */
            transition-property: all; /* transition-all */
            transition-duration: 150ms;
            background-color: #fff; /* bg-white */
            border: 2px solid #e5e7eb; /* border-2 border-gray-200 */
            color: #1f2937; /* text-gray-800 */
            font-size: 1.5rem; /* text-custom-button */
        }
        .option-button:hover {
            background-color: #f3f4f6; /* hover:bg-gray-100 */
        }
        .option-button.active {
            background-color: #e9d5ff; /* bg-purple-200 */
            border-color: #9333ea; /* border-purple-600 */
            color: #6b21a8; /* text-purple-800 */
            font-weight: 700; /* font-bold */
        }
        .next-button {
            width: 100%;
            color: #fff; /* text-white */
            font-weight: 700; /* font-bold */
            padding: 1rem 1.5rem; /* py-4 px-6 */
            border-radius: 1rem; /* rounded-2xl */
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; /* transition-colors */
            transition-duration: 150ms;
            background-color: #9333ea; /* bg-purple-600 */
            font-size: 2rem; /* text-custom-next-button */
        }
        .next-button:hover {
            background-color: #7e22ce; /* hover:bg-purple-700 */
        }
        .next-button:disabled {
            background-color: #9ca3af; /* bg-gray-400 */
            cursor: not-allowed;
        }

        .back-button {
            display: flex;
            align-items: center;
            color: #6b7280; /* text-gray-500 */
            font-size: 1.5rem; /* text-custom-back-button */
        }
        .back-button:hover {
            color: #374151; /* hover:text-gray-700 */
        }
        
        /* Utility classes */
        .p-6 { padding: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .mb-4 { margin-bottom: 1rem; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05); }

        /* Icon styling */
        .h-5 { height: 1.25rem; }
        .w-5 { width: 1.25rem; }
        [dir="rtl"] .rtl-scale-x-100 { transform: scaleX(-1); }
        .rtl-scale-x-100 { transform: scaleX(1); }

    </style>
    <script src="app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center p-4">

    <!-- Main application container. The mx-auto class will center the container. -->
    <div id="app" class="app-container">
        <!-- Content will be dynamically inserted here by JavaScript -->
    </div>

    <script>
        // Use a content fetcher to get the Heroicons SVG
        // This is a common way to use icons in pure JS
        const getChevronRightIcon = () => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5 rtl-scale-x-100">
                <path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.5 4.5a.75.75 0 0 1 0 1.06l-4.5 4.5a.75.75 0 0 1-1.06-1.06L12.94 10 8.22 5.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
            </svg>
        `;

        const getChevronLeftIcon = () => `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5 rtl-scale-x-100">
                <path fill-rule="evenodd" d="M11.78 5.22a.75.75 0 0 1 0 1.06L7.06 10l4.72 4.72a.75.75 0 1 1-1.06 1.06l-5.25-5.25a.75.75 0 0 1 0-1.06l5.25-5.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
            </svg>
        `;


        // Question data objects for each page
        const pages = {
            welcome: {
                id: 'welcome',
                title: 'ברוכים הבאים',
                text: 'מיד נשאל ארבע שאלות על השפעת התרופות. \nלאחר מכן תתבקשו לבצע כמה מטלות פשוטות. הפעילות כולה אמורה לארוך כ-5 דקות, נשמח אם תחזרו עליה החודש כמה שיותר פעמים - פעם במצב Off ופעם במצב On.',
                buttonText: 'מעבר לשאלות',
            },
            onOffQuestion: {
                id: 'onOffQuestion',
                text: 'מה הרגשתך?\nבאיזו מידה את/ה חש/ה כרגע במצב OFF?',
                options: [
                    { text: 'כלל לא', value: '1' },
                    { text: 'במידה מועטה', value: '2' },
                    { text: 'במידה מסוימת', value: '3' },
                    { text: 'במידה רבה', value: '4' },
                    { text: 'לחלוטין', value: '5' },
                ],
            },
            levodopaQuestion_1: {
                id: 'levodopaQuestion_1',
                text: 'כמה זמן בערך עבר מאז לקחת Levodopa בפעם האחרונה?',
                options: [
                    { text: 'עד שעה', value: 'lessThanHour' },
                    { text: 'שעה או יותר', value: 'moreThanHour' },
                ],
                oneClick: true,
            },
            levodopaQuestion_2_less: {
                id: 'levodopaQuestion_2_less',
                text: 'כמה זמן בערך עבר מאז לקחת Levodopa בפעם האחרונה?',
                options: [
                    { text: 'פחות מ-15 דקות', value: '0' },
                    { text: 'בין 15 דקות ל-30 דקות', value: '15' },
                    { text: 'בין 30 דקות ל-45 דקות', value: '30' },
                    { text: 'בין 45 דקות לשעה', value: '45' },
                ],
            },
            levodopaQuestion_2_more: {
                id: 'levodopaQuestion_2_more',
                text: 'כמה זמן בערך עבר מאז לקחת Levodopa בפעם האחרונה?',
                options: [
                    { text: 'בין שעה לשעתיים', value: '60' },
                    { text: 'בין שעתיים לשלוש שעות', value: '120' },
                    { text: 'בין שלוש לארבע שעות', value: '180' },
                    { text: 'ארבע שעות או יותר', value: '240' },
                ],
            },
            eatingQuestion_1: {
                id: 'eatingQuestion_1',
                text: 'כמה זמן עבר מאז אכלת בפעם האחרונה?',
                options: [
                    { text: 'עד שעה', value: 'lessThanHour' },
                    { text: 'שעה או יותר', value: 'moreThanHour' },
                ],
                oneClick: true,
            },
            eatingQuestion_2_less: {
                id: 'eatingQuestion_2_less',
                text: 'כמה זמן עבר מאז אכלת בפעם האחרונה?',
                options: [
                    { text: 'פחות מ-15 דקות', value: '0' },
                    { text: 'בין 15 דקות ל-30 דקות', value: '15' },
                    { text: 'בין 30 דקות ל-45 דקות', value: '30' },
                    { text: 'בין 45 דקות לשעה', value: '45' },
                ],
            },
            eatingQuestion_2_more: {
                id: 'eatingQuestion_2_more',
                text: 'כמה זמן עבר מאז אכלת בפעם האחרונה?',
                options: [
                    { text: 'בין שעה לשעתיים', value: '60' },
                    { text: 'בין שעתיים לשלוש שעות', value: '120' },
                    { text: 'בין שלוש לארבע שעות', value: '180' },
                    { text: 'ארבע שעות או יותר', value: '240' },
                ],
            },
            gettingUpQuestion: {
                id: 'gettingUpQuestion',
                text: 'האם היית מתקשה אם היית צריך לקום עכשיו מהכיסא?',
                options: [
                    { text: 'לא', value: 'False' },
                    { text: 'כן', value: 'True' },
                ],
            },
            debug: {
                id: 'debug',
                title: 'תשובות',
                buttonText: 'התחל מחדש',
            }
        };

        let currentPage = 'welcome';
        let selectedOption = null;
        let userAnswers = {};
        const appContainer = document.getElementById('app');

        // Function to render the current page
        const renderPage = (pageId) => {
            appContainer.innerHTML = ''; // Clear previous content
            currentPage = pageId;

            let contentHTML = '';
            let backButtonHTML = '';
            let nextButtonHTML = '';
            const pageData = pages[currentPage];

            // Render Back button if not on the welcome page
            if (currentPage !== 'welcome') {
                backButtonHTML = `
                    <div class="flex justify-start items-center px-4 py-2 text-purple-700 font-bold text-xl">
                        <button id="back-button" class="back-button text-custom-back-button">
                            ${getChevronRightIcon()}
                            <span>חזרה</span>
                        </button>
                    </div>
                `;
            }

            // Function to render multiline text as separate paragraphs
            // Added my-0 to remove vertical margins from paragraphs
            const renderMultiLineText = (text, className = 'text-gray-600 leading-relaxed') => {
                const lines = text.split('\n');
                return lines.map(line => `<p class="${className} my-0">${line}</p>`).join('');
            };

            // Render the main content for the current page
            switch (currentPage) {
                case 'welcome':
                    // Reduced padding and space-y for welcome screen
                    contentHTML = `
                        <div class="p-4 flex flex-col items-center text-right space-y-0">
                            <h1 class="text-custom-title font-bold text-gray-800 mb-2">${pageData.title}</h1>
                            ${renderMultiLineText(pageData.text, 'text-custom-body text-gray-600 leading-relaxed')}
                        </div>
                    `;
                    nextButtonHTML = `
                        <div class="p-6">
                            <button id="next-button" class="next-button text-custom-next-button">
                                ${pageData.buttonText}
                            </button>
                        </div>
                    `;
                    break;
                case 'onOffQuestion':
                case 'levodopaQuestion_1':
                case 'levodopaQuestion_2_less':
                case 'levodopaQuestion_2_more':
                case 'eatingQuestion_1':
                case 'eatingQuestion_2_less':
                case 'eatingQuestion_2_more':
                case 'gettingUpQuestion':
                    // Reduced padding and space-y for question pages
                    contentHTML = `
                        <div class="p-4 flex flex-col space-y-4 h-full text-right">
                            <div class="flex flex-col space-y-px"> <!-- New div for question text with minimal spacing -->
                                ${pageData.text.split('\n').map(line => `
                                    <p class="text-custom-body text-gray-800 font-semibold my-0">${line}</p>
                                `).join('')}
                            </div>
                            <div class="flex flex-col space-y-4 flex-grow w-full" id="options-container">
                                ${pageData.options.map(option => `
                                    <button
                                        data-value="${option.value}"
                                        class="option-button text-custom-button"
                                    >
                                        ${option.text}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    if (!pageData.oneClick) {
                        nextButtonHTML = `
                            <div class="p-6">
                                <button id="next-button" disabled class="next-button text-custom-next-button">
                                    הבא
                                </button>
                            </div>
                        `;
                    }
                    break;
                case 'debug':
                    // This function generates the JSON summary. The user requested to keep this logic but hide the output.
                    const generateJsonSummary = () => {
                        const summary = {};
                        
                        // Likert Scale Question
                        if (userAnswers.onOffQuestion) {
                            summary.onOffFeeling = parseInt(userAnswers.onOffQuestion);
                        }

                        // Levodopa Time Questions
                        if (userAnswers.levodopaQuestion_1 === 'lessThanHour') {
                            if (userAnswers.levodopaQuestion_2_less) {
                                summary.timeSinceLevodopaMinutes = parseInt(userAnswers.levodopaQuestion_2_less);
                            }
                        } else if (userAnswers.levodopaQuestion_1 === 'moreThanHour') {
                            if (userAnswers.levodopaQuestion_2_more) {
                                summary.timeSinceLevodopaMinutes = parseInt(userAnswers.levodopaQuestion_2_more);
                            }
                        }

                        // Eating Time Questions
                        if (userAnswers.eatingQuestion_1 === 'lessThanHour') {
                            if (userAnswers.eatingQuestion_2_less) {
                                summary.timeSinceEatingMinutes = parseInt(userAnswers.eatingQuestion_2_less);
                            }
                        } else if (userAnswers.eatingQuestion_1 === 'moreThanHour') {
                            if (userAnswers.eatingQuestion_2_more) {
                                summary.timeSinceEatingMinutes = parseInt(userAnswers.eatingQuestion_2_more);
                            }
                        }

                        // Final Boolean Question (now called gettingUpQuestion)
                        if (userAnswers.gettingUpQuestion) {
                            summary.gettingUpDifficulty = userAnswers.gettingUpQuestion === 'True' ? true : false;
                        }

                        return JSON.stringify(summary, null, 2);
                    };
                    
                    const jsonSummary = generateJsonSummary();
                    
                    // The debug-toggle button and the summary container have been removed as requested.
                    contentHTML = `
                        <div class="flex-grow p-6 flex flex-col items-center justify-end">
                            <h1 class="text-3xl font-bold mb-12 text-center">תודה!</h1>
                            <br />
                            <br />
                            <br />
                            <br />
                            <br />
                            <button id="next-activity-button" class="next-button w-full max-w-xs flex items-center justify-center space-x-2 space-x-reverse shadow-lg text-custom-next-button mb-4">
                                <span>לפעילות הבאה</span>
                                ${getChevronLeftIcon()}
                            </button>
                        </div>
                    `;
                    
                    // No next button for the debug page, as requested.
                    nextButtonHTML = ``;
                    
                    break;
            }

            // Assemble the final HTML and inject it
            appContainer.innerHTML = `
                <div class="flex flex-col h-full">
                    ${backButtonHTML}
                    <div class="flex-grow flex flex-col justify-between">
                        ${contentHTML}
                    </div>
                    ${nextButtonHTML}
                </div>
            `;
            
            // Re-attach event listeners after DOM update
            addEventListeners();
        };

        // Function to handle moving to the next page
        const handleNext = () => {
            // Save the current answer before moving on, if it's a question page
            if (pages[currentPage].options && selectedOption) {
                userAnswers[currentPage] = selectedOption;
            }

            // Reset selected option for the next page
            selectedOption = null;

            // Conditional navigation logic
            switch (currentPage) {
                case 'welcome':
                    renderPage('onOffQuestion');
                    break;
                case 'onOffQuestion':
                    renderPage('levodopaQuestion_1');
                    break;
                case 'levodopaQuestion_1':
                    if (userAnswers.levodopaQuestion_1 === 'lessThanHour') {
                        renderPage('levodopaQuestion_2_less');
                    } else {
                        renderPage('levodopaQuestion_2_more');
                    }
                    break;
                case 'levodopaQuestion_2_less':
                case 'levodopaQuestion_2_more':
                    renderPage('eatingQuestion_1');
                    break;
                case 'eatingQuestion_1':
                    if (userAnswers.eatingQuestion_1 === 'lessThanHour') {
                        renderPage('eatingQuestion_2_less');
                    } else {
                        renderPage('eatingQuestion_2_more');
                    }
                    break;
                case 'eatingQuestion_2_less':
                case 'eatingQuestion_2_more':
                    renderPage('gettingUpQuestion');
                    break;
                case 'gettingUpQuestion':
                    renderPage('debug');
                    break;
                case 'debug':
                    // This function generates the JSON summary. 
                    const generateJsonSummary = () => {
                        const summary = {};
                        
                        // Likert Scale Question
                        if (userAnswers.onOffQuestion) {
                            summary.onOffFeeling = parseInt(userAnswers.onOffQuestion);
                        }

                        // Levodopa Time Questions
                        if (userAnswers.levodopaQuestion_1 === 'lessThanHour') {
                            if (userAnswers.levodopaQuestion_2_less) {
                                summary.timeSinceLevodopaMinutes = parseInt(userAnswers.levodopaQuestion_2_less);
                            }
                        } else if (userAnswers.levodopaQuestion_1 === 'moreThanHour') {
                            if (userAnswers.levodopaQuestion_2_more) {
                                summary.timeSinceLevodopaMinutes = parseInt(userAnswers.levodopaQuestion_2_more);
                            }
                        }

                        // Eating Time Questions
                        if (userAnswers.eatingQuestion_1 === 'lessThanHour') {
                            if (userAnswers.eatingQuestion_2_less) {
                                summary.timeSinceEatingMinutes = parseInt(userAnswers.eatingQuestion_2_less);
                            }
                        } else if (userAnswers.eatingQuestion_1 === 'moreThanHour') {
                            if (userAnswers.eatingQuestion_2_more) {
                                summary.timeSinceEatingMinutes = parseInt(userAnswers.eatingQuestion_2_more);
                            }
                        }

                        // Final Boolean Question (now called gettingUpQuestion)
                        if (userAnswers.gettingUpQuestion) {
                            summary.gettingUpDifficulty = userAnswers.gettingUpQuestion === 'True' ? true : false;
                        }

                        return JSON.stringify(summary, null, 2);
                    };

                    const jsonSummary = generateJsonSummary();
                    notifyClientToSendPayload(jsonSummary);
                    // Finished with quiz
                    notifyClientToNext();
                    break;
                default:
                    renderPage('welcome');
            }
        };

        // Function to handle moving to the previous page
        const handleBack = () => {
            selectedOption = null;
            delete userAnswers[currentPage];
            
            switch (currentPage) {
                case 'onOffQuestion':
                    renderPage('welcome');
                    break;
                case 'levodopaQuestion_1':
                    // Restore the previous selected option
                    selectedOption = userAnswers.onOffQuestion;
                    renderPage('onOffQuestion');
                    break;
                case 'levodopaQuestion_2_less':
                case 'levodopaQuestion_2_more':
                    // Restore the selection for the previous page
                    selectedOption = userAnswers.levodopaQuestion_1;
                    renderPage('levodopaQuestion_1');
                    break;
                case 'eatingQuestion_1':
                    const prevLevodopaPage = userAnswers.levodopaQuestion_1 === 'lessThanHour' ? 'levodopaQuestion_2_less' : 'levodopaQuestion_2_more';
                    selectedOption = userAnswers[prevLevodopaPage];
                    renderPage(prevLevodopaPage);
                    break;
                case 'eatingQuestion_2_less':
                case 'eatingQuestion_2_more':
                    selectedOption = userAnswers.eatingQuestion_1;
                    renderPage('eatingQuestion_1');
                    break;
                case 'gettingUpQuestion':
                    const prevEatingPage = userAnswers.eatingQuestion_1 === 'lessThanHour' ? 'eatingQuestion_2_less' : 'eatingQuestion_2_more';
                    selectedOption = userAnswers[prevEatingPage];
                    renderPage(prevEatingPage);
                    break;
                case 'debug':
                    selectedOption = userAnswers.gettingUpQuestion;
                    renderPage('gettingUpQuestion');
                    break;
                default:
                    renderPage('welcome');
            }
        };

        // Function to attach all event listeners
        const addEventListeners = () => {
            const nextButton = document.getElementById('next-button');
            if (nextButton) {
                nextButton.addEventListener('click', handleNext);
            }

            const backButton = document.getElementById('back-button');
            if (backButton) {
                backButton.addEventListener('click', handleBack);
            }
            
            const nextActivityButton = document.getElementById('next-activity-button');
            if (nextActivityButton) {
                nextActivityButton.addEventListener('click', handleNext);
            }

            const optionsContainer = document.getElementById('options-container');
            if (optionsContainer) {
                optionsContainer.querySelectorAll('.option-button').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const value = event.target.dataset.value;
                        
                        // Update selected option
                        selectedOption = value;

                        // Update button styles
                        optionsContainer.querySelectorAll('.option-button').forEach(btn => {
                            btn.classList.remove('active');
                        });
                        event.target.classList.add('active');

                        // Enable next button
                        if (nextButton) {
                            nextButton.disabled = false;
                        }

                        // Handle one-click pages
                        const pageData = pages[currentPage];
                        if (pageData.oneClick) {
                             setTimeout(() => handleNext(), 100);
                        }
                    });
                });
            }
        };

        // Initialize the app on window load
        window.onload = () => {
            renderPage('welcome');
        };

    </script>
</body>
</html>
