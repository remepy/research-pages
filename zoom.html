        /* Basic body and font styling */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Aligned to the top */
            align-items: center;

            color: #333;
            margin: 0;
            padding: 0;

            background-color: #ffffff;

            flex-direction: column;
            align-items: center;
            gap: 0.5rem; /* Reduced gap between elements from 1rem */
            max-width: 100vw;
            width: 100%;
            box-sizing: border-box;
            margin-top: 0.5rem;
        }
        
        .welcome-container {
            text-align: center;
        }

        /* Welcome screen content layout */
        .welcome-content {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0.5rem; /* Reduced gap from 2rem */
        }

            font-size: 2rem; /* text-5xl */

            align-items: center; /* Applied from instructionTextContainer */
            justify-content: center; /* Applied from instructionTextContainer */

        /* Canvas for the 3D animation */
        #animationCanvas {
            width: 80%;
            max-width: 300px;
            aspect-ratio: 1 / 1;
            background-color: #e2e8f0;
            border-radius: 1rem;
            padding: 0.5rem; /* Reduced padding from 1rem */
            box-sizing: border-box;
            flex-shrink: 0; /* Prevents the canvas from shrinking and wrapping */
        }
        
        #pinch-png {
            flex-shrink: 0; /* Prevents the image from shrinking and wrapping */
            max-width: 100px; /* Make the pinch image responsive */
            height: auto;
        }

        /* Game canvas styling */
        canvas {
            border: 2px solid #cbd5e1;
            border-radius: 1rem;
            background-color: #e2e8f0;
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            touch-action: none;
            transition: border-color 0.5s ease-in-out, border-width 0.5s ease-in-out, box-shadow 0.5s ease-in-out;

            border: 8px solid #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.75);

            justify-content: center;

            align-items: center;

            max-width: 95%;

        const START_SCALE_FACTOR = 10.0;
        const END_SCALE_FACTOR = 1.0;
        const TOTAL_PROGRESS_LEVELS = 10;
        const stepCooldown = 300;

        
        /* *************************** */
        /* pseudo random image picking */
        /* *************************** */
        function setCookie(name, value) {
            const date = new Date();
            date.setTime(date.getTime() + (24 * 60 * 60 * 1000));
            let expires = "; expires=" + date.toUTCString();
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        const m = 2147483647; // Modulus (2^31 - 1, a large prime)
        const a = 16807;     // Multiplier
        const c = 0;         // Increment (0 for multiplicative LCG)
        let currentLcgState;        // The current internal state of the LCG
        const CURRENT_STATE_COOKIE_NAME = "prng_current_state";

        function getDaySeed() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return today.getTime();
        }

        function generateNextNumber() {
            currentLcgState = getCookie(CURRENT_STATE_COOKIE_NAME);
            if (currentLcgState == null) {
                currentLcgState = getDaySeed();
            }
            currentLcgState = (a * currentLcgState + c) % m;
            setCookie(CURRENT_STATE_COOKIE_NAME, currentLcgState.toString());
            const randomNumber = currentLcgState % imageSources.length;

            return randomNumber;
        }

         * @param {string} type - The message type ('info', 'success', 'error').
         */
        function showMessage(message, type = 'info') {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden');
            if (type === 'success') {
                messageBox.style.backgroundColor = '#d1fae5';
                messageBox.style.color = '#065f46';
            } else if (type === 'error') {
                messageBox.style.backgroundColor = '#fee2e2';
                messageBox.style.color = '#991b1b';
            } else {
                messageBox.style.backgroundColor = '#dbeafe';
                messageBox.style.color = '#1e40af';
            }
        }

        /**
         * Hides the message box.
         */
        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        /**
         * Calculates the angle between two points.
         * @param {object} p1 - Point 1.
         * @param {object} p2 - Point 2.
         * @returns {number} The angle in degrees (0-360).
         */
        function calculateAngle(p1, p2) {
            const pointingFinger = p1.clientY < p2.clientY ? p1 : p2;
            const thumb = p1.clientY < p2.clientY ? p2 : p1;
            const deltaX = thumb.clientX - pointingFinger.clientX;
            const deltaY = thumb.clientY - pointingFinger.clientY;
            let angleRad = Math.atan2(deltaX, -deltaY);
            let angleDeg = angleRad * 180 / Math.PI;
            if (angleDeg < 0) {
                angleDeg += 360;
            }
            return angleDeg;
        }

        /**
         * Displays the pinch data in JSON format.
         */
        function notifyPinchData() {
            if (pinchEvents.length === 0) {
                console.log('No pinch data');
                return;
            }
            const jsonPinchData = JSON.stringify(pinchEvents, null, 2);

            const payload = {
                gameName: 'zoom',
                time: (Date.now() - startTaskTime) / 1000,
                pinchData: jsonPinchData
            }
            notifyClientToSendPayload(payload);
        }

        // --- Welcome Screen Static Image Logic ---
        
        const welcomeImage = new Image();
        welcomeImage.crossOrigin = 'anonymous';
        const welcomeImageUrl = 'https://upload.wikimedia.org/wikipedia/commons/2/2e/Coral_Outcrop_Flynn_Reef.jpg';

        function drawStaticWelcomeImage() {
            if (!welcomeImage.complete) return; // Ensure image is loaded

            // Adjust canvas size to fit parent container while maintaining aspect ratio
            const parentContainer = animationCanvas.parentElement;
            const maxDimension = Math.min(parentContainer.offsetWidth, parentContainer.offsetHeight);
            const ratio = welcomeImage.width / welcomeImage.height;
            if (ratio > 1) { // Landscape image
                animationCanvas.width = maxDimension;
                animationCanvas.height = maxDimension / ratio;
            } else { // Portrait or square image
                animationCanvas.height = maxDimension;
                animationCanvas.width = maxDimension * ratio;
            }
            
            ctxAnimation.clearRect(0, 0, animationCanvas.width, animationCanvas.height);
            // Draw the image completely zoomed out (static)
            ctxAnimation.drawImage(welcomeImage, 0, 0, animationCanvas.width, animationCanvas.height);
        }

        welcomeImage.onload = () => {
            drawStaticWelcomeImage();
            window.addEventListener('resize', drawStaticWelcomeImage); // Redraw on resize
        };
        
        welcomeImage.onerror = () => {
            console.error("Failed to load the welcome image.");
            ctxAnimation.fillStyle = "white";
            ctxAnimation.textAlign = "center";
            ctxAnimation.font = "20px Arial";
            ctxAnimation.fillText("Failed to load image.", animationCanvas.width / 2, animationCanvas.height / 2);
        };
        
        welcomeImage.src = welcomeImageUrl;
        
        // --- Core Game Logic ---

        /**
         * Draws the loading screen on the game canvas.
         */
        function drawLoadingScreen() {
            ctxGame.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
            ctxGame.fillStyle = '#64748b';
            ctxGame.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
            ctxGame.fillStyle = '#f8fafc';
            ctxGame.font = '20px Inter';
            ctxGame.textAlign = 'center';
            ctxGame.fillText('טוען תמונה...', gameCanvas.width / 2, gameCanvas.height / 2);
        }

        /**
         * Updates the visual progress bar and triggers a redraw.
         * @param {number} newLevel - The new progress level.
         */
        function updateProgressBar(newLevel) {
            newLevel = Math.min(TOTAL_PROGRESS_LEVELS, Math.max(0, newLevel));
            currentProgressBarLevel = newLevel;

            const segments = progressBar.children;
            for (let i = 0; i < segments.length; i++) {
                if (i < currentProgressBarLevel) {
                    segments[i].classList.add('active');
                } else {
                    segments[i].classList.remove('active');
                }
            }
            drawImage();

            if (currentProgressBarLevel === TOTAL_PROGRESS_LEVELS) {
                resetButton.classList.remove('hidden-but-takes-space');
                nextActivityButton.classList.remove('hidden-but-takes-space');
                instructionTextElement.innerHTML = "<strong>הצלחתם! התמונה נחשפה.</strong>";
                gameCanvas.classList.add('game-complete');
                notifyPinchData();
            } else {
                resetButton.classList.add('hidden-but-takes-space');
                nextActivityButton.classList.add('hidden-but-takes-space');
                instructionTextElement.textContent = "השתמשו בתנועת צביטה כדי לחשוף את התמונה הנסתרת מהר ככל שתוכלו.";
            }
        }

        /**
         * Safely advances the progress step, with a cooldown.
         */
        function advanceProgressStep() {
            if (canAdvanceStep && currentProgressBarLevel < TOTAL_PROGRESS_LEVELS) {
                updateProgressBar(currentProgressBarLevel + 1);
                canAdvanceStep = false;
                setTimeout(() => {
                    canAdvanceStep = true;
                }, stepCooldown);
            }
        }

        /**
         * Draws the image on the canvas with the current zoom level.
         */
        function drawImage() {
            ctxGame.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            if (!isImageLoaded) {
                drawLoadingScreen();
                return;
            }

            const progressRatio = currentProgressBarLevel / TOTAL_PROGRESS_LEVELS;
            const currentScaleFactor = START_SCALE_FACTOR - (START_SCALE_FACTOR - END_SCALE_FACTOR) * progressRatio;

            const imageSquareSize = Math.min(image.naturalWidth, image.naturalHeight);
            const croppedSourceWidth = imageSquareSize / currentScaleFactor;
            const croppedSourceHeight = imageSquareSize / currentScaleFactor;

            const sx = (image.naturalWidth - imageSquareSize) / 2 + (imageSquareSize - croppedSourceWidth) / 2;
            const sy = (image.naturalHeight - imageSquareSize) / 2 + (imageSquareSize - croppedSourceHeight) / 2;

            ctxGame.drawImage(image, sx, sy, croppedSourceWidth, croppedSourceHeight, 0, 0, gameCanvas.width, gameCanvas.height);
        }

        /**
         * Initializes a new game by loading the next image.
         */
        function startNewGame() {
            currentImageIndex = generateNextNumber();
            pinchEvents = [];
            isImageLoaded = false;
            
            drawLoadingScreen();
            
            gameCanvas.classList.remove('game-complete');
            image.src = imageSources[currentImageIndex];
        }

        /**
         * Initializes the progress bar segments.
         */
        function initializeProgressBar() {
            progressBar.innerHTML = '';
            for (let i = 0; i < TOTAL_PROGRESS_LEVELS; i++) {
                const segment = document.createElement('div');
                segment.classList.add('progress-segment');
                progressBar.appendChild(segment);
            }
        }

        /**
         * Initializes all game functionality.
         */
        function initializeGame() {
            // Set game canvas size
            gameCanvas.width = gameCanvas.offsetWidth;
            gameCanvas.height = gameCanvas.offsetWidth;

            // Event listeners
            window.addEventListener('resize', () => {
                gameCanvas.width = gameCanvas.offsetWidth;
                gameCanvas.height = gameCanvas.offsetWidth;
                drawImage();
            });
            resetButton.addEventListener('click', (event) => {
                event.preventDefault();
                notifyClientToResetGame();
                startNewGame();
                hideMessage();
                canAdvanceStep = true;
            });
            nextActivityButton.addEventListener('click', (event) => {
                event.preventDefault();
                notifyClientToNext();
            });

            gameCanvas.addEventListener('wheel', (event) => {
                event.preventDefault();
                if (canAdvanceStep && event.deltaY > 0) {
                    pinchEvents.push({
                        startTimestamp: Date.now(),
                        startDistance: 'N/A',
                        startAngle: 'N/A',
                        endTimestamp: Date.now(),
                        endDistance: 'N/A',
                        endAngle: 'N/A'
                    });
                    advanceProgressStep();
                }
            });
            gameCanvas.addEventListener('touchstart', (event) => {
                if (event.touches.length === 2) {
                    currentPinch = {
                        startTimestamp: Date.now(),
                        startDistance: Math.hypot(
                            event.touches[1].clientX - event.touches[0].clientX,
                            event.touches[1].clientY - event.touches[0].clientY
                        ),
                        startAngle: calculateAngle(event.touches[0], event.touches[1]),
                        endTimestamp: null,
                        endDistance: null,
                        endAngle: null
                    };
                }
                event.preventDefault();
            }, { passive: false });
            gameCanvas.addEventListener('touchmove', (event) => {
                if (event.touches.length === 2) {
                    lastTouchPoints = [event.touches[0], event.touches[1]];
                }
                event.preventDefault();
            }, { passive: false });
            gameCanvas.addEventListener('touchend', (event) => {
                if (currentPinch.startTimestamp && lastTouchPoints.length === 2) {
                    currentPinch.endTimestamp = Date.now();
                    currentPinch.endDistance = Math.hypot(
                        lastTouchPoints[1].clientX - lastTouchPoints[0].clientX,
                        lastTouchPoints[1].clientY - lastTouchPoints[0].clientY
                    );
                    currentPinch.endAngle = calculateAngle(lastTouchPoints[0], lastTouchPoints[1]);
                    if (currentPinch.endDistance < currentPinch.startDistance) {
                        pinchEvents.push(currentPinch);
                        advanceProgressStep();
                    }
                    currentPinch = {};
                } else {
                    currentPinch = {};
                    lastTouchPoints = [];
                }
            });
            gameCanvas.addEventListener('touchcancel', () => {
                currentPinch = {};
                lastTouchPoints = [];
            });

            // Initialize progress bar
            initializeProgressBar();

            // Load the first image
            image.onload = () => {
                isImageLoaded = true;
                updateProgressBar(0);
            };
            image.onerror = () => {
                isImageLoaded = false;
                showMessage("טעינת התמונה נכשלה. אנא בדוק את כתובת ה-URL של התמונה.", 'error');
                ctxGame.fillStyle = '#ef4444';
                ctxGame.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                ctxGame.fillStyle = '#f8fafc';
                ctxGame.font = '20px Inter';
                ctxGame.textAlign = 'center';
                ctxGame.fillText('שגיאת טעינת תמונה', gameCanvas.width / 2, gameCanvas.height / 2);
            };

            image.src = imageSources[currentImageIndex];
            drawLoadingScreen();
            startTaskTime = Date.now(); // Start timing when the game begins
        }

        // The main entry point - controls the transition between the welcome and game screens.
        window.onload = () => {
            startButton.addEventListener('click', (event) => {
                event.preventDefault();
                welcomeScreen.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                initializeGame();
            });
        };
    </script>
</body>
