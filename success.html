<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פעילות הושלמה</title>
    <script src="app.js"></script>
</head>
<body style="background-color: #f9fafb; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; padding: 1rem;">
    <!-- Main container for the content, centered on the page. -->
    <!-- It has a white background, rounded corners, shadow, and a maximum width to match the screenshot's compact look. -->
    <div style="background-color: #ffffff; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); max-width: 24rem; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center;">

        <!-- Top text section: "כל הכבוד!" (Well done!) -->
        <!-- Text is purple, bold, and aligned to the right, as seen in the screenshot. -->
        <div style="color: #6d28d9; font-size: 2.25rem; font-weight: 700; text-align: right; width: 100%;">
            כל הכבוד!
        </div>

        <!-- Second line of top text: "השלמתם את הפעילות." (You have completed the activity.) -->
        <!-- Text is purple and aligned to the right. -->
        <div style="color: #6d28d9; font-size: 1.75rem; text-align: right; width: 100%; margin-top: 1.5rem;">
            השלמתם את הפעילות.
        </div>

        <!-- Image placeholder for the rabbit with the "FINISH" ribbon. -->
        <!-- A placeholder image from placehold.co is used to visually represent the rabbit. -->
        <!-- The image is circular, matching the style in the screenshot. -->
        <div style="width: 12rem; height: 12rem; background-color: #f3f4f6; border-radius: 9999px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 1.5rem;">
            <img src="success_rabbit.png" alt="Finish line illustration" style="width: 100%; height: 100%; object-fit: cover; border-radius: 9999px;">
        </div>

        <!-- Bottom text section: "נתראה בסיבוב הבא!" (See you next round!) -->
        <!-- Text is purple, semi-bold, and centered. -->
        <div style="color: #6d28d9; font-size: 1.75rem; font-weight: 600; margin-top: 1.5rem;">
            נתראה בסיבוב הבא!
        </div>

        <!-- Button to navigate to the main menu. -->
        <!-- The button is styled with a purple background, white text, rounded corners, and a shadow. -->
        <button onclick="notifyClientToBackToFirst()" style="background-color: #6d28d9; color: #ffffff; font-weight: 700; padding: 0.75rem 1.5rem; border-radius: 9999px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); width: 100%; margin-top: 1.5rem; border: none; cursor: pointer; font-size: 2rem;">
            לסיום הפעילות
        </button>
        
    </div>
</body>
</html>
